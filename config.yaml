---
tools:
  - name: brew
    enabled: true
    install-priority: 80
    install:
      macos: |
        install-brew
    bootstrap:
      - priority: 80
        macos: |
          export PATH="$(brew --prefix)/bin:$PATH"

  - name: apt
    enabled: true
    install-priority: 80
    install:
      ubuntu: |
        sudo apt update
  
  - name: snap
    enabled: true
    bootstrap:
      - priority: 80
        ubuntu: |
          export PATH="/snap/bin:$PATH"

  - name: zsh
    enabled: true
    install-priority: 80
    install:
      ubuntu: |
        apt-install zsh
    bootstrap:
      - priority: 80
        default: |
          # zsh mod
          zmodload zsh/zprof
          zmodload zsh/mathfunc 

          # disable zsh history expansion triggered by "!" character
          setopt no_bang_hist

          # hide history with space
          setopt HIST_IGNORE_SPACE

          # initialize zsh completion engine and bash-compatibility bridge
          autoload -Uz compinit
          if [ "$(date +'%j')" != "$(stat -f '%Sm' -t '%j' ~/.zcompdump 2>/dev/null)" ]; then
              compinit
          else
              compinit -C
          fi
          autoload -Uz bashcompinit && bashcompinit

          # zsh case insensitive completion
          zstyle ':completion:*' matcher-list '' 'm:{a-zA-Z}={A-Za-z}' 'r:|[._-]=* r:|=*' 'l:|=* r:|=*'

          # Enable bracketed paste magic to handle long text safely, speed up paste
          autoload -Uz bracketed-paste-magic
          zle -N bracketed-paste bracketed-paste-magic

  - name: uv
    enabled: true
    install-priority: 90
    install:
      macos: |
        brew-install uv
      ubuntu: |
        if command -v uv >/dev/null 2>&1; then
          log "uv is already installed"
          if [ "${DRY_RUN:-0}" = "1" ]; then
            log "[dry-run] uv self update"
          else
            uv self update
          fi
        else
          if [ "${DRY_RUN:-0}" = "1" ]; then
            log "[dry-run] install uv via curl"
          else
            curl -LsSf https://astral.sh/uv/install.sh | sh
          fi
        fi

  - name: python3
    enabled: true
    install-priority: 90
    install:
      default: |
        install-python 3.14
    bootstrap:
      - priority: 90
        default: |
          export PATH="$HOME/.local/bin:$PATH"

  - name: powerlevel10k
    enabled: true
    install-priority: 100
    install:
      default: |
        git-install https://github.com/romkatv/powerlevel10k.git "${HOME}/opt/powerlevel10k"
    bootstrap:
      - priority: 70
        default: |
          if [[ -r "${XDG_CACHE_HOME:-$HOME/.cache}/p10k-instant-prompt-${(%):-%n}.zsh" ]]; then
            source "${XDG_CACHE_HOME:-$HOME/.cache}/p10k-instant-prompt-${(%):-%n}.zsh"
          fi
      - priority: 100
        default: |
          source "${HOME}/opt/powerlevel10k/powerlevel10k.zsh-theme"
          source "${HOME}/.p10k.zsh"

  - name: gpg
    enabled: true
    install-priority: 100
    install:
      macos: |
        brew-install gnupg
        brew-install pinentry
        mkdir -p "$HOME/.gnupg"
        chmod 700 "$HOME/.gnupg"
        if command -v pinentry-mac >/dev/null 2>&1 && ! grep -q 'pinentry-program' "$HOME/.gnupg/gpg-agent.conf"; then
          printf 'pinentry-program %s\n' "$(command -v pinentry-mac)" > "$HOME/.gnupg/gpg-agent.conf"
        fi
      ubuntu: |
        apt-install pinentry-curses
        apt-install pinentry-tty
        gpgconf --kill gpg-agent
        mkdir -p "$HOME/.gnupg"
        chmod 700 "$HOME/.gnupg"
        if command -v pinentry-curses >/dev/null 2>&1 && ! grep -q 'pinentry-program' "$HOME/.gnupg/gpg-agent.conf"; then
          printf 'pinentry-program %s\n' "$(command -v pinentry-curses)" > "$HOME/.gnupg/gpg-agent.conf"
        fi
        gpgconf --kill gpg-agent
        gpg-connect-agent updatestartuptty /bye
    bootstrap:
      - priority: 100
        default: |
          export GPG_TTY="$TTY"

  - name: fzf
    enabled: true
    install-priority: 100
    install:
      macos: |
        brew-install fzf
      ubuntu: |
        apt-install fzf
    bootstrap:
      - priority: 100
        default: |
          source <(fzf --zsh)
          source "$HOME/.config/fzf/.fzf.zsh"

  - name: zoxide
    enabled: true
    install-priority: 100
    install: 
      macos: | 
        brew-install zoxide
      ubuntu: |
        apt-install zoxide
    bootstrap:
      - priority: 100
        default: |
          eval "$(zoxide init zsh)"
  
  - name: bat
    enabled: true
    install-priority: 100
    install: 
      macos: |
        brew-install bat
      ubuntu: |
        apt-install bat
    bootstrap:
      - priority: 100
        default:
          export MANPAGER="sh -c 'col -bx | bat -l man -p'"
          export BAT_THEME="Catppuccin Macchiato"
          alias cat="bat --paging=never --plain"
          alias less="bat -p"

  - name: delta
    enabled: true
    install-priority: 100
    install:
      macos: |
        brew-install git-delta
      ubuntu: |
        apt-install git-delta


  - name: yazi
    enabled: true
    install-priority: 100
    install:
      macos: |
        brew-install yazi
      ubuntu: |
        snap-install yazi --classic
    bootstrap:
      - priority: 100
        default: |
          function y() {
            local tmp="$(mktemp -t "yazi-cwd.XXXXXX")" cwd
            yazi "$@" --cwd-file="$tmp"
            if cwd="$(command cat -- "$tmp")" && [ -n "$cwd" ] && [ "$cwd" != "$PWD" ]; then
              builtin cd -- "$cwd"
            fi
            rm -f -- "$tmp"
          }

  - name: fast-syntax-highlighting
    enabled: true
    install-priority: 100
    install:
      default: |
        git-install https://github.com/zdharma-continuum/fast-syntax-highlighting.git "${HOME}/opt/fast-syntax-highlighting"
    bootstrap:
      - priority: 100
        default: |
          source "${HOME}/opt/fast-syntax-highlighting/fast-syntax-highlighting.plugin.zsh"

  - name: zsh-autosuggestions
    enabled: true
    install-priority: 100
    install:
      default: |
        git-install https://github.com/zsh-users/zsh-autosuggestions.git "${HOME}/opt/zsh-autosuggestions"
    bootstrap:
      - priority: 100
        default: |
          source "${HOME}/opt/zsh-autosuggestions/zsh-autosuggestions.zsh"

  - name: fzf-tab-completion
    enabled: true
    install-priority: 100
    install:
      default: |
        git-install https://github.com/lincheney/fzf-tab-completion.git "${HOME}/opt/fzf-tab-completion"
    bootstrap:
      - priority: 100
        default: |
          source "${HOME}/opt/fzf-tab-completion/zsh/fzf-zsh-completion.sh"
          bindkey '^I' fzf_completion # Tab key

  - name: bash-my-aws
    enabled: true
    install-priority: 100
    install:
      default: |
        git-install https://github.com/mbailey/bash-my-aws.git "${HOME}/opt/bash-my-aws"
    bootstrap:
      - priority: 100
        default: |
          export BMA_HOME="${HOME}/opt/bash-my-aws"
          export PATH="$PATH:${BMA_HOME}/bin"
          export BMA_COLUMNISE_ONLY_WHEN_TERMINAL_PRESENT=true
          source ${BMA_HOME}/aliases
          source ${BMA_HOME}/bash_completion.sh
