---
enabled: true
priority: 100
tools:
  - name: brew
    enabled: true
    install-priority: 80
    install:
      macos: |
        install-brew
    bootstrap:
      - priority: 80
        macos: |
          export PATH="$(brew --prefix)/bin:$PATH"

  - name: apt
    enabled: true
    install-priority: 80
    install:
      ubuntu: |
        sudo apt update
        apt-install build-essential
        apt-install ca-certificates

  - name: snap
    enabled: true
    bootstrap:
      - priority: 80
        ubuntu: |
          export PATH="/snap/bin:$PATH"

  - name: zsh
    enabled: true
    install-priority: 80
    install:
      ubuntu: |
        apt-install zsh
    bootstrap:
      - priority: 80
        default: |
          # zsh mod
          zmodload zsh/zprof
          zmodload zsh/mathfunc 

          # history
          HISTFILE="$HOME/.zsh_history"
          HISTSIZE=10000
          SAVEHIST=10000
          setopt APPEND_HISTORY INC_APPEND_HISTORY HIST_IGNORE_DUPS

          # interactive comment with '#'
          # disable bang history expansion with '!'
          # Ignore history entries that start with a space
          setopt INTERACTIVE_COMMENTS NO_BANG_HIST HIST_IGNORE_SPACE

          # initialize zsh completion engine and bash-compatibility bridge
          autoload -Uz compinit
          if [ "$(date +'%j')" != "$(stat -f '%Sm' -t '%j' ~/.zcompdump 2>/dev/null)" ]; then
              compinit
          else
              compinit -C
          fi
          autoload -Uz bashcompinit && bashcompinit

          # zsh case insensitive completion
          zstyle ':completion:*' matcher-list '' 'm:{a-zA-Z}={A-Za-z}' 'r:|[._-]=* r:|=*' 'l:|=* r:|=*'

          # Enable bracketed paste magic to handle long text safely, speed up paste
          autoload -Uz bracketed-paste-magic
          zle -N bracketed-paste bracketed-paste-magic

          # special characters for word boundaries in zsh
          WORDCHARS=''
          
          alias ls="ls --color=auto -G -a"
          alias ll="ls -alFh"

  - name: uv
    enabled: true
    install-priority: 90
    install:
      macos: |
        brew-install uv
      ubuntu: |
        curl-install -LsSf https://astral.sh/uv/install.sh | sh

  - name: python3
    enabled: true
    install-priority: 90
    install:
      default: |
        install-python 3.14
    bootstrap:
      - priority: 90
        default: |
          export PATH="$HOME/.local/bin:$PATH"
        ubuntu: |
          export PATH="$HOME/.local/share/uv/python/cpython-3.14-linux-x86_64-gnu/bin:$PATH"
          export PATH="$HOME/.local/bin:$PATH" 

  - name: gnu-utils
    enabled: true
    install-priority: 90
    install:
      macos: |
        brew-install coreutils
        brew-install findutils
        brew-install gnu-sed
        brew-install gnu-time
        brew-install gnu-getopt
    bootstrap:
      - priority: 90
        macos: |
          BREW_PREFIX="$(brew --prefix)"
          export PATH="$BREW_PREFIX/opt/coreutils/libexec/gnubin:$PATH"
          export PATH="$BREW_PREFIX/opt/gnu-sed/libexec/gnubin:$PATH"
          export PATH="$BREW_PREFIX/opt/gnu-getopt/bin:$PATH"

          alias grep="ggrep --color=auto"
          alias time="gtime -p"

  - name: n
    enabled: true
    install-priority: 90
    install:
      macos: |
        brew-install n
      ubuntu: |
        curl-install -L https://bit.ly/n-install | bash
    bootstrap:
      - priority: 90
        default: |
          export N_PREFIX="$HOME/.n"
          export PATH="$N_PREFIX/bin:$PATH"

  - name: powerlevel10k
    enabled: true
    install-priority: 100
    install:
      default: |
        git-install https://github.com/romkatv/powerlevel10k.git "${HOME}/opt/powerlevel10k"
    bootstrap:
      - priority: 70
        default: |
          if [[ -r "${XDG_CACHE_HOME:-$HOME/.cache}/p10k-instant-prompt-${(%):-%n}.zsh" ]]; then
            source "${XDG_CACHE_HOME:-$HOME/.cache}/p10k-instant-prompt-${(%):-%n}.zsh"
          fi
      - priority: 100
        default: |
          source "${HOME}/opt/powerlevel10k/powerlevel10k.zsh-theme"
          source "${HOME}/.p10k.zsh"

  - name: gpg
    enabled: true
    install-priority: 100
    install:
      macos: |
        brew-install gnupg
        brew-install pinentry
        mkdir -p "$HOME/.gnupg"
        chmod 700 "$HOME/.gnupg"
        if command -v pinentry-mac >/dev/null 2>&1 && ! grep -q 'pinentry-program' "$HOME/.gnupg/gpg-agent.conf"; then
          printf 'pinentry-program %s\n' "$(command -v pinentry-mac)" > "$HOME/.gnupg/gpg-agent.conf"
        fi
      ubuntu: |
        apt-install pinentry-curses
        apt-install pinentry-tty
        gpgconf --kill gpg-agent
        mkdir -p "$HOME/.gnupg"
        chmod 700 "$HOME/.gnupg"
        if command -v pinentry-curses >/dev/null 2>&1 && ! grep -q 'pinentry-program' "$HOME/.gnupg/gpg-agent.conf"; then
          printf 'pinentry-program %s\n' "$(command -v pinentry-curses)" > "$HOME/.gnupg/gpg-agent.conf"
        fi
        gpgconf --kill gpg-agent
        gpg-connect-agent updatestartuptty /bye
    bootstrap:
      - priority: 100
        default: |
          export GPG_TTY="$TTY"

  - name: fzf
    enabled: true
    install-priority: 100
    install:
      macos: |
        brew-install fzf
      ubuntu: |
        apt-install fzf
    bootstrap:
      - priority: 100
        default: |
          source <(fzf --zsh)
          source "$HOME/.config/fzf/.fzf.zsh"

  - name: zoxide
    enabled: true
    install-priority: 100
    install:
      macos: |
        brew-install zoxide
      ubuntu: |
        apt-install zoxide
    bootstrap:
      - priority: 100
        default: |
          eval "$(zoxide init zsh)"

  - name: bat
    enabled: true
    install-priority: 100
    install:
      macos: |
        brew-install bat
      ubuntu: |
        apt-install bat
        link /usr/bin/batcat "$HOME/.local/bin/bat"
    bootstrap:
      - priority: 100
        default: |
          export MANPAGER="sh -c 'col -bx | bat -l man -p'"
          export BAT_THEME="Catppuccin Macchiato"
          alias cat="bat --paging=never --plain"
          alias less="bat -p"

  - name: delta
    enabled: true
    install-priority: 100
    install:
      macos: |
        brew-install git-delta
      ubuntu: |
        apt-install git-delta

  - name: yazi
    enabled: true
    install-priority: 100
    install:
      macos: |
        brew-install yazi
      ubuntu: |
        snap-install yazi --classic
    bootstrap:
      - priority: 100
        default: |
          function y() {
            local tmp="$(mktemp -t "yazi-cwd.XXXXXX")" cwd
            yazi "$@" --cwd-file="$tmp"
            if cwd="$(command cat -- "$tmp")" && [ -n "$cwd" ] && [ "$cwd" != "$PWD" ]; then
              builtin cd -- "$cwd"
            fi
            rm -f -- "$tmp"
          }

  - name: fast-syntax-highlighting
    enabled: true
    install-priority: 100
    install:
      default: |
        git-install https://github.com/zdharma-continuum/fast-syntax-highlighting.git "${HOME}/opt/fast-syntax-highlighting"
    bootstrap:
      - priority: 100
        default: |
          source "${HOME}/opt/fast-syntax-highlighting/fast-syntax-highlighting.plugin.zsh"

  - name: zsh-autosuggestions
    enabled: true
    install-priority: 100
    install:
      default: |
        git-install https://github.com/zsh-users/zsh-autosuggestions.git "${HOME}/opt/zsh-autosuggestions"
    bootstrap:
      - priority: 100
        default: |
          source "${HOME}/opt/zsh-autosuggestions/zsh-autosuggestions.zsh"

  - name: fzf-tab-completion
    enabled: true
    install-priority: 100
    install:
      default: |
        git-install https://github.com/lincheney/fzf-tab-completion.git "${HOME}/opt/fzf-tab-completion"
    bootstrap:
      - priority: 100
        default: |
          source "${HOME}/opt/fzf-tab-completion/zsh/fzf-zsh-completion.sh"
          bindkey '^I' fzf_completion # Tab key

  - name: curl
    enabled: true
    install-priority: 100
    install:
      macos: |
        brew-install curl
    bootstrap:
      - priority: 100
        macos: |
          export PATH="$(brew --prefix curl)/bin:$PATH"
  
  - name: fd
    enabled: true
    install-priority: 100
    install:
      macos: |
        brew-install fd
      ubuntu: |
        apt-install fd-find
    bootstrap:
      - priority: 100
        ubuntu:
          alias fd=fdfind
 
  - name: ripgrep
    enabled: true
    install-priority: 100
    install:
      macos: |
        brew-install ripgrep
      ubuntu: |
        apt-install ripgrep

  - name: openssl
    enabled: true
    install-priority: 100
    install:
      macos: |
        brew-install openssl
    bootstrap:
      - priority: 100
        macos: |
          export PATH="$(brew --prefix openssl)/bin:$PATH"

  - name: copycat
    enabled: true
    install-priority: 100
    install:
      default: |
        git-install https://github.com/mchozhang/copycat.git "${HOME}/opt/copycat"
        uv-tool-install -e "${HOME}/opt/copycat"

  - name: tree
    enabled: true
    install-priority: 100
    install:
      macos: |
        brew-install tree
      ubuntu: |
        apt-install tree
    bootstrap:
      - priority: 100
        default: |
          alias tree="tree -C'